name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip openjdk-17-jdk autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: pip install --upgrade pip cython==0.29.36 buildozer
      - name: Pre-accept Android SDK licenses
        run: |
          D=~/.buildozer/android/platform/android-sdk/licenses
          mkdir -p $D
          echo -e "\n24333f8a63b6825ea9c5514f83c2829b004d1fee\nd56f5187479451eabf01fb78af6dfcb131a6481e" > $D/android-sdk-license
          echo -e "\n84831b9409646a918e30573bab4c9c91346d8abd" > $D/android-sdk-preview-license
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: |
          grep -v '^#' build.log > clean.log
          echo "===== ERROR-LIKE LINES ====="
          grep -n -i -E "error|failed|aidl|not found|exception" clean.log | grep -v -i -E "deprecat|warning|Werror|license" | head -30
          echo "===== LAST 60 LINES ====="
          tail -60 clean.log
      - uses: actions/upload-artifact@v4
        with:
          name: SciCalc-apk
          path: bin/*.apk
