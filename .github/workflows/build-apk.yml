name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.10"
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y git zip unzip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo5 cmake libffi-dev libssl-dev
      - name: Install Buildozer
        run: pip install --upgrade pip cython==0.29.36 buildozer
      - name: Install Android SDK
        run: |
          java -version
          S=$HOME/.buildozer/android/platform/android-sdk
          mkdir -p $S/cmdline-tools
          cd /tmp
          curl -sSLo cmd.zip https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip
          unzip -q cmd.zip
          mv cmdline-tools $S/cmdline-tools/latest
          ln -s $S/cmdline-tools/latest $S/tools
          yes | $S/cmdline-tools/latest/bin/sdkmanager --sdk_root=$S --licenses > /dev/null || true
          $S/cmdline-tools/latest/bin/sdkmanager --sdk_root=$S "platform-tools" "build-tools;33.0.2" "platforms;android-33"
          ls $S $S/tools/bin
      - name: Build APK
        shell: bash
        run: buildozer -v android debug 2>&1 | tee build.log
      - name: Show error
        if: failure()
        run: |
          echo "=== LAST 50 LINES ==="
          grep -v '^#' build.log | tail -50
      - uses: actions/upload-artifact@v4
        with:
          name: SciCalc-apk
          path: bin/*.apk
